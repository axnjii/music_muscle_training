   <script>
        // --- CẤU HÌNH BIẾN TOÀN CỤC ---
        const VF = Vex.Flow;
        let currentNote = null;
        let score = { correct: 0, wrong: 0 };
        let pianoSampler = null;
        let guitarSampler = null;
        let audioStarted = false;
        let metronomeAudioContext = null;
        let metronomeTimer = null;
        let nextMetronomeBeat = 0;
        let metronomeBeatCount = 0;
        let metronomeBpm = 100;
        
        let config = {
            level: 'easy',     
            clef: 'treble',    
            inputType: 'piano' 
        };

        const noteNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const accidentals = ['b', '', '#'];

        function updateMetronomeBpm(value) {
            metronomeBpm = Math.max(40, Math.min(240, Number(value)));
            document.getElementById('metronome-slider').value = metronomeBpm;
            document.getElementById('metronome-bpm').textContent = `${metronomeBpm} BPM`;
            if (metronomeTimer && metronomeAudioContext) {
                nextMetronomeBeat = metronomeAudioContext.currentTime;
            }
        }

        function scheduleMetronomeBeats() {
            const context = metronomeAudioContext;
            if (!context) return;

            while (nextMetronomeBeat < context.currentTime + 0.1) {
                const beatTime = nextMetronomeBeat;
                const isDownbeat = metronomeBeatCount % 4 === 0;
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.frequency.value = isDownbeat ? 1200 : 800;
                gain.gain.setValueAtTime(0.0001, beatTime);
                gain.gain.exponentialRampToValueAtTime(0.2, beatTime + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, beatTime + 0.08);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start(beatTime);
                oscillator.stop(beatTime + 0.085);

                const beatNumber = metronomeBeatCount % 4 + 1;
                setTimeout(() => {
                    if (!metronomeTimer) return;
                    document.getElementById('metronome-beat').textContent = `${beatNumber}/4`;
                    document.getElementById('metronome-status').textContent = `Đang chạy · Nhịp ${beatNumber}/4 · ${metronomeBpm} BPM`;
                }, Math.max(0, (beatTime - context.currentTime) * 1000));

                metronomeBeatCount++;
                nextMetronomeBeat += 60 / metronomeBpm;
            }
        }

        async function toggleMetronome() {
            const status = document.getElementById('metronome-status');
            const button = document.getElementById('metronome-toggle');

            if (metronomeTimer) {
                clearInterval(metronomeTimer);
                metronomeTimer = null;
                button.innerHTML = '<i class="fas fa-play mr-2" aria-hidden="true"></i>Bật metronome';
                button.setAttribute('aria-pressed', 'false');
                status.textContent = 'Đang tắt';
                document.getElementById('metronome-beat').textContent = '—';
                return;
            }

            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                status.textContent = 'Trình duyệt không hỗ trợ phát âm thanh metronome.';
                return;
            }

            try {
                if (!metronomeAudioContext) metronomeAudioContext = new AudioContextClass();
                await metronomeAudioContext.resume();
            } catch (error) {
                status.textContent = 'Không thể khởi động âm thanh metronome.';
                console.error('Không thể khởi động metronome:', error);
                return;
            }

            metronomeBeatCount = 0;
            nextMetronomeBeat = metronomeAudioContext.currentTime;
            scheduleMetronomeBeats();
            metronomeTimer = setInterval(scheduleMetronomeBeats, 25);
            button.innerHTML = '<i class="fas fa-stop mr-2" aria-hidden="true"></i>Tắt metronome';
            button.setAttribute('aria-pressed', 'true');
            status.textContent = `Đang chạy · Nhịp 1/4 · ${metronomeBpm} BPM`;
        }

        function setupMetronome() {
            document.getElementById('metronome-toggle').addEventListener('click', toggleMetronome);
            document.getElementById('metronome-slider').addEventListener('input', (event) => {
                updateMetronomeBpm(event.target.value);
                if (metronomeTimer) {
                    document.getElementById('metronome-status').textContent = `Đang chạy · ${metronomeBpm} BPM`;
                }
            });
            document.querySelectorAll('[data-bpm-change]').forEach((button) => {
                button.addEventListener('click', () => {
                    updateMetronomeBpm(metronomeBpm + Number(button.dataset.bpmChange));
                    if (metronomeTimer) {
                        document.getElementById('metronome-status').textContent = `Đang chạy · ${metronomeBpm} BPM`;
                    }
                });
            });
        }

     // --- KHỞI TẠO ÂM THANH (TONE.JS) ---

        function initAudio() {
            // 1. Khởi tạo tiếng Piano (Salamander Grand Piano)
            if (!pianoSampler) {
                pianoSampler = new Tone.Sampler({
                    urls: { "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3" },
                    baseUrl: "https://tonejs.github.io/audio/salamander/",
                    release: 0.18,
                }).toDestination();
            }
            
            // 2. Khởi tạo tiếng Guitar thật (Acoustic Nylon Guitar)
            if (!guitarSampler) {
                // Tạo một chút vang (Reverb) để tiếng đàn mộc mạc như phát ra từ thùng guitar thật
                const guitarReverb = new Tone.Freeverb({
                    roomSize: 0.6,
                    dampening: 2500
                }).toDestination();

                // Load các file MP3 tiếng guitar thật từ thư viện MIDI Soundfont
                guitarSampler = new Tone.Sampler({
                    urls: {
                        "A2": "A2.mp3",
                        "C3": "C3.mp3",
                        "E3": "E3.mp3",
                        "A3": "A3.mp3",
                        "C4": "C4.mp3",
                        "E4": "E4.mp3",
                        "A4": "A4.mp3",
                        "C5": "C5.mp3"
                    },
                    baseUrl: "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_guitar_nylon-mp3/",
                }).connect(guitarReverb); // Nối qua cục Reverb rồi mới ra loa
                
                guitarSampler.volume.value = 5; // Tăng âm lượng vì sample guitar gốc hơi nhỏ
            }
            
            if (Tone.context.state !== 'running') Tone.context.resume();
            audioStarted = true;
        }

        document.body.addEventListener('click', () => {
            if (!audioStarted) initAudio();
        }, { once: true });

        function playNoteSound(midiNumber) {
            if (!audioStarted) return;
            const freq = Tone.Frequency(midiNumber, "midi").toNote();
            
            // Phân loại phát âm thanh dựa trên giao diện đang chọn
            if (config.inputType === 'guitar') {
                if (guitarSampler && guitarSampler.loaded) {
                    // Để dây ngân vang dài tự nhiên (2n)
                    guitarSampler.triggerAttackRelease(freq, "2n");
                }
            } else {
                if (pianoSampler && pianoSampler.loaded) {
                    pianoSampler.triggerAttackRelease(freq, "4n");
                }
            }
        }

        // --- XỬ LÝ SỰ KIỆN NÚT BẤM CẤU HÌNH ---
        function setupButtonGroups() {
            const groups = ['level', 'clef', 'input'];
            groups.forEach(group => {
                const container = document.getElementById(`group-${group}`);
                const buttons = container.querySelectorAll('.btn-option');
                buttons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        const val = btn.getAttribute('data-val');
                        if(group === 'level') config.level = val;
                        if(group === 'clef') config.clef = val;
                        if(group === 'input') config.inputType = val;
                        
                        if(group === 'level' && val === 'easy' && config.clef !== 'treble') {
                            document.querySelector('#group-clef button[data-val="treble"]').click();
                        }
                        
                        updateInputUI();
                        generateQuestion();
                    });
                });
            });
        }

        function updateInputUI() {
            document.getElementById('input-buttons').classList.add('hidden', 'flex');
            document.getElementById('input-buttons').classList.remove('flex');
            document.getElementById('input-piano').classList.add('hidden');
            document.getElementById('input-guitar').classList.add('hidden');

            if (config.inputType === 'buttons') {
                document.getElementById('input-buttons').classList.remove('hidden');
                document.getElementById('input-buttons').classList.add('flex');
            } else if (config.inputType === 'piano') {
                document.getElementById('input-piano').classList.remove('hidden');
            } else if (config.inputType === 'guitar') {
                document.getElementById('input-guitar').classList.remove('hidden');
            }
        }

        // --- SINH GIAO DIỆN TƯƠNG TÁC ---
        function initButtons() {
            const container = document.getElementById('input-buttons');
            container.innerHTML = '';
            noteNames.forEach(note => {
                const btn = document.createElement('button');
                btn.className = 'w-16 h-16 rounded-full bg-white border-2 border-gray-300 text-xl font-bold text-gray-700 hover:border-blue-500 hover:text-blue-500 hover:bg-blue-50 shadow-sm transition active:scale-95';
                btn.innerText = note;
                btn.onclick = () => checkAnswer(note); 
                container.appendChild(btn);
            });
        }

        function initPiano() {
            const wrapper = document.getElementById('piano-wrapper');
            wrapper.innerHTML = '';
            const octaves = [3, 4, 5];
            const keys = [
                {note: 'C', type: 'w'}, {note: 'C#', type: 'b'}, {note: 'D', type: 'w'}, {note: 'D#', type: 'b'},
                {note: 'E', type: 'w'}, {note: 'F', type: 'w'}, {note: 'F#', type: 'b'}, {note: 'G', type: 'w'},
                {note: 'G#', type: 'b'}, {note: 'A', type: 'w'}, {note: 'A#', type: 'b'}, {note: 'B', type: 'w'}
            ];

            octaves.forEach(octave => {
                keys.forEach(k => {
                    const keyDiv = document.createElement('div');
                    const fullNote = k.note + octave;
                    const midiNum = Tone.Frequency(fullNote).toMidi();
                    
                    if (k.type === 'w') {
                        keyDiv.className = 'key-white';
                        keyDiv.innerHTML = `<span>${k.note}</span>`;
                    } else {
                        keyDiv.className = 'key-black';
                    }
                    
                    keyDiv.dataset.midi = midiNum;
                    keyDiv.addEventListener('mousedown', () => checkAnswerByMidi(midiNum));
                    
                    wrapper.appendChild(keyDiv);
                });
            });
            setTimeout(() => { document.querySelector('.piano-container').scrollLeft = 150; }, 100);
        }

        function initGuitar() {
            const fb = document.getElementById('fretboard');
            fb.innerHTML = '';
            
            // Xếp đúng chiều: Dây 1 (mỏng nhất) ở trên, dây 6 (bass) ở dưới cùng
            const strings = [
                { num: 1, rootMidi: 64, name: 'E4', thickness: 1 },
                { num: 2, rootMidi: 59, name: 'B3', thickness: 1.5 },
                { num: 3, rootMidi: 55, name: 'G3', thickness: 2.5 },
                { num: 4, rootMidi: 50, name: 'D3', thickness: 3.5 },
                { num: 5, rootMidi: 45, name: 'A2', thickness: 4.5 },
                { num: 6, rootMidi: 40, name: 'E2', thickness: 5.5 }
            ];
            
            const numFrets = 15;

            strings.forEach((str, strIndex) => {
                const row = document.createElement('div');
                row.className = 'guitar-string-row';
                
                const stringLine = document.createElement('style');
                stringLine.innerHTML = `#fretboard .guitar-string-row:nth-child(${strIndex+1})::before { height: ${str.thickness}px; }`;
                document.head.appendChild(stringLine);

                for (let fret = 0; fret <= numFrets; fret++) {
                    const fretDiv = document.createElement('div');
                    fretDiv.className = 'fret';
                    
                    const midiNote = str.rootMidi + fret;
                    fretDiv.dataset.midi = midiNote;
                    
                    if (fret === 0) {
                        fretDiv.innerHTML = `<span class="text-xs font-bold text-gray-500 absolute -left-6">${str.num}</span>`;
                    }
                    
                    if (str.num === 3 && [3, 5, 7, 9, 12, 15].includes(fret)) {
                        const marker = document.createElement('div');
                        marker.className = 'fret-marker';
                        fretDiv.appendChild(marker);
                        if(fret === 12) { 
                            marker.style.top = '10px';
                            const marker2 = document.createElement('div');
                            marker2.className = 'fret-marker';
                            marker2.style.top = '40px';
                            fretDiv.appendChild(marker2);
                        }
                    }
                    
                    // Hiển thị số ngăn phím ở dưới dây số 6
                    if (str.num === 6 && [3, 5, 7, 9, 12, 15].includes(fret)) {
                        const label = document.createElement('div');
                        label.className = 'fret-number-label';
                        label.innerText = fret;
                        fretDiv.appendChild(label);
                    }

                    fretDiv.addEventListener('mousedown', () => checkAnswerByMidi(midiNote));
                    row.appendChild(fretDiv);
                }
                fb.appendChild(row);
            });
        }


        // --- LOGIC PHÁT SINH NỐT NHẠC ---
        function generateNote() {
            let clef = config.clef;
            if (clef === 'mixed') {
                clef = Math.random() > 0.5 ? 'treble' : 'bass';
            }

            const baseNote = noteNames[Math.floor(Math.random() * noteNames.length)];
            let octave, acc = '';

            if (config.level === 'easy') {
                octave = (clef === 'treble') ? 4 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 2);
                if (clef === 'treble' && baseNote === 'A' && octave === 5) octave = 4;
            } else {
                octave = (clef === 'treble') ? 3 + Math.floor(Math.random() * 3) : 2 + Math.floor(Math.random() * 3);
                
                if (config.level === 'hard') {
                    if (Math.random() > 0.5) acc = accidentals[Math.floor(Math.random() * 3)];
                }
            }

            let vexAcc = acc === 'b' ? 'b' : acc === '#' ? '#' : '';
            let noteString = baseNote + vexAcc + octave; 
            let midiVal = Tone.Frequency(noteString).toMidi();

            return {
                base: baseNote,
                acc: acc,
                octave: octave,
                clef: clef,
                vexNote: `${baseNote.toLowerCase()}/${octave}`,
                vexAcc: vexAcc,
                midi: midiVal,
                fullName: noteString
            };
        }

        function drawStaff(noteObj) {
            const container = document.getElementById('staff-container');
            container.innerHTML = '';
            
            document.getElementById('ai-response').classList.add('hidden');

            const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
            renderer.resize(250, 150);
            const context = renderer.getContext();

            const stave = new VF.Stave(10, 20, 200);
            stave.addClef(noteObj.clef);
            
            let keySig = "C";
            if (config.level === 'hard') {
                 const keys = ["G", "F", "D", "Bb", "Eb"];
                 if (Math.random() > 0.5) {
                     keySig = keys[Math.floor(Math.random() * keys.length)];
                     stave.addKeySignature(keySig);
                 }
            }
            noteObj.currentKeySig = keySig; 
            
            stave.setContext(context).draw();

            const staveNote = new VF.StaveNote({ 
                clef: noteObj.clef, 
                keys: [noteObj.vexNote], 
                duration: "w" 
            });

            if (noteObj.vexAcc) {
                staveNote.addModifier(new VF.Accidental(noteObj.vexAcc));
            }

            VF.Formatter.FormatAndDraw(context, stave, [staveNote]);
        }

        function generateQuestion() {
            currentNote = generateNote();
            drawStaff(currentNote);
        }

        // --- XỬ LÝ ĐÁP ÁN ---
        function triggerFeedback(isCorrect) {
            const msg = document.getElementById('feedback-msg');
            const playArea = document.getElementById('play-area');
            
            if (isCorrect) {
                msg.innerText = "Chính xác!";
                msg.className = "absolute top-2 left-1/2 transform -translate-x-1/2 text-lg font-bold px-4 py-1 rounded-full bg-green-100 text-green-700 transition-opacity opacity-100 z-10 shadow";
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                playNoteSound(currentNote.midi); 
            } else {
                msg.innerText = `Sai! Nốt đúng là: ${currentNote.base}${currentNote.acc}`;
                msg.className = "absolute top-2 left-1/2 transform -translate-x-1/2 text-lg font-bold px-4 py-1 rounded-full bg-red-100 text-red-700 transition-opacity opacity-100 z-10 shadow";
                playArea.classList.add('shake');
                setTimeout(() => playArea.classList.remove('shake'), 400);
            }

            setTimeout(() => { msg.classList.remove('opacity-100'); msg.classList.add('opacity-0'); }, 1500);
        }

        function checkAnswer(selectedBase) {
            if (!currentNote) return;
            if (selectedBase === currentNote.base) {
                score.correct++;
                document.getElementById('score-correct').innerText = score.correct;
                triggerFeedback(true);
                setTimeout(generateQuestion, 800);
            } else {
                score.wrong++;
                document.getElementById('score-wrong').innerText = score.wrong;
                triggerFeedback(false);
            }
        }

        function checkAnswerByMidi(selectedMidi) {
            if (!currentNote) return;
            
            playNoteSound(selectedMidi);

            if (selectedMidi === currentNote.midi) {
                score.correct++;
                document.getElementById('score-correct').innerText = score.correct;
                triggerFeedback(true);
                setTimeout(generateQuestion, 1000);
            } else {
                score.wrong++;
                document.getElementById('score-wrong').innerText = score.wrong;
                triggerFeedback(false);
            }
        }

        // --- TÍNH NĂNG AI ---
        async function explainWithAI() {
            if (!currentNote) return;
            const apiKey = prompt("Nhập Gemini API Key (tạo miễn phí tại aistudio.google.com):");
            if (!apiKey) return;

            const responseBox = document.getElementById('ai-response');
            responseBox.innerText = "Đang phân tích...";
            responseBox.classList.remove('hidden');

            const promptText = `Hãy đóng vai giáo viên âm nhạc, giải thích cho người lớn tại sao nốt nhạc hiện tại lại đọc là ${currentNote.fullName}. 
            Bối cảnh bản nhạc: Khóa ${currentNote.clef === 'treble' ? 'Sol' : 'Fa'}, Hóa biểu là ${currentNote.currentKeySig}, nốt nằm ở dòng/khe tương ứng với ${currentNote.base}. 
            Viết ngắn gọn 2 câu tiếng Việt dễ hiểu nhất.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                
                const data = await response.json();
                responseBox.innerText = data.candidates[0].content.parts[0].text;
            } catch (error) {
                responseBox.innerText = "Lỗi kết nối API. Vui lòng kiểm tra lại Key.";
            }
        }

        // --- XỬ LÝ THIẾT BỊ NGOẠI VI (WEB MIDI API) ---
        function initMIDI() {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
            } else {
                updateMIDIStatus("Trình duyệt không hỗ trợ Web MIDI", "text-red-600 bg-red-50 border-red-200");
            }
        }

        function onMIDISuccess(midiAccess) {
            const inputs = midiAccess.inputs;

            if (inputs.size === 0) {
                updateMIDIStatus("Chưa cắm đàn/thiết bị MIDI", "text-gray-500 bg-gray-50 border-gray-200");
            }

            // Duyệt qua tất cả các cổng MIDI đang cắm
            inputs.forEach((input) => {
                input.onmidimessage = handleMIDIMessage;
                updateMIDIStatus(`🎹 Đã kết nối: ${input.name}`, "text-green-600 bg-green-50 border-green-200");
            });

            // Lắng nghe sự kiện nếu người dùng cắm/rút cáp USB trong lúc đang mở web
            midiAccess.onstatechange = (e) => {
                if (e.port.type === "input") {
                    if (e.port.state === "connected") {
                        e.port.onmidimessage = handleMIDIMessage;
                        updateMIDIStatus(`🎹 Đã kết nối: ${e.port.name}`, "text-green-600 bg-green-50 border-green-200");
                    } else {
                        updateMIDIStatus("Đã ngắt kết nối đàn MIDI", "text-red-600 bg-red-50 border-red-200");
                    }
                }
            };
        }

        function onMIDIFailure() {
            updateMIDIStatus("Bị từ chối quyền truy cập MIDI", "text-red-600 bg-red-50 border-red-200");
        }

        function handleMIDIMessage(message) {
            // message.data là mảng 3 byte: [Lệnh, Cao độ (Nốt), Lực gõ (Velocity)]
            const command = message.data[0];
            const note = message.data[1];
            const velocity = (message.data.length > 2) ? message.data[2] : 0;

            // Command 144 -> 159 là Note On (tương ứng với 16 kênh MIDI).
            // Nếu Velocity > 0 tức là phím được ấn xuống (nếu = 0 là buông phím ra)
            if (command >= 144 && command <= 159 && velocity > 0) {
                // Tự động kích hoạt check đáp án bằng MIDI Number
                checkAnswerByMidi(note);
                
                // (Hiệu ứng) Làm phím ảo trên web cũng lún xuống theo khi đánh đàn thật
                highlightVirtualKey(note);
            }
        }

        function updateMIDIStatus(text, colorClasses) {
            const statusEl = document.getElementById('midi-status');
            if (statusEl) {
                statusEl.innerText = text;
                statusEl.className = `mt-2 text-xs font-bold px-2 py-1 rounded border inline-block ${colorClasses}`;
            }
        }

        // Hàm phụ: Đánh đàn thật thì đàn trên web cũng sáng lên
        function highlightVirtualKey(midiNum) {
            const key = document.querySelector(`.piano-container [data-midi="${midiNum}"]`);
            if (key) {
                // Lưu background cũ để trả lại
                const isBlack = key.classList.contains('key-black');
                const originalBg = isBlack ? '#222' : 'white';
                
                key.style.background = '#93c5fd'; // Màu xanh dương nhạt (blue-300)
                key.style.transform = isBlack ? 'translateX(-14px) translateY(2px)' : 'translateY(2px)';
                
                setTimeout(() => {
                    key.style.background = originalBg;
                    key.style.transform = isBlack ? 'translateX(-14px)' : 'none';
                }, 200);
            }
        }

        // --- KHỞI TẠO ỨNG DỤNG ---
        setupButtonGroups();
        setupMetronome();
        initButtons();
        initPiano();
        initGuitar();
        initMIDI();
        generateQuestion();
        updateInputUI();
        
    </script>
</body>
</html>
